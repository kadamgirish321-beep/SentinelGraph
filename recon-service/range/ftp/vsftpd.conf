# vsftpd configuration for AttackGraphX lab FTP target
# FOR AUTHORIZED LABORATORY USE ONLY

# Allow anonymous access (lab demonstration only)
anonymous_enable=YES
local_enable=NO

# Read-only anonymous access
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# Chroot — restrict to /var/ftp
chroot_local_user=NO

# Passive mode settings for Docker networking
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=0.0.0.0

# Logging (helps demonstrate service banners to Nmap)
xferlog_enable=YES
vsftpd_log_file=/var/log/vsftpd.log

# Listen on IPv4
listen=YES
listen_ipv6=NO
